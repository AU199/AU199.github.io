<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRC Scouting Dashboard</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, sans-serif;
      }
      body {
        max-width: 1000px;
        margin: 0 auto;
        padding: 1rem;
      }
      h1, h2 {
        margin-bottom: 0.5rem;
      }
      .card {
        border: 1px solid #8884;
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        border-bottom: 1px solid #8884;
        text-align: left;
        padding: 0.35rem;
      }
      .muted {
        color: #777;
      }
      .error {
        color: #c0392b;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Scouting Dashboard (Static + Statbotics)</h1>
    <p class="muted">
      This page is fully static for GitHub Pages. Data comes from
      <code>scouting-data.json</code>, generated by <code>main.py</code> using the
      Statbotics REST API.
    </p>

    <section class="card">
      <h2>Team Summary</h2>
      <div id="team-summary">Loading…</div>
    </section>

    <section class="card">
      <h2>Season Metrics</h2>
      <div id="team-year">Loading…</div>
    </section>

    <section class="card">
      <h2>Recent Matches</h2>
      <div id="matches">Loading…</div>
    </section>

    <section class="card">
      <h2>API Fetch Issues</h2>
      <pre id="errors" class="error">None</pre>
    </section>

    <script>
      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function renderKeyValues(target, obj, keys) {
        const list = keys
          .filter((k) => obj && obj[k] !== undefined)
          .map((k) => `<li><strong>${escapeHtml(k)}:</strong> ${escapeHtml(obj[k])}</li>`);
        target.innerHTML = list.length ? `<ul>${list.join("")}</ul>` : '<span class="muted">No data found.</span>';
      }

      function renderMatches(target, matches) {
        if (!Array.isArray(matches) || matches.length === 0) {
          target.innerHTML = '<span class="muted">No match data found.</span>';
          return;
        }

        const rows = matches.slice(0, 15).map((m) => `
          <tr>
            <td>${escapeHtml(m.event || "")}</td>
            <td>${escapeHtml(m.match || m.match_number || "")}</td>
            <td>${escapeHtml(m.alliance || "")}</td>
            <td>${escapeHtml(m.result || "")}</td>
            <td>${escapeHtml(m.epa_end ?? m.epa ?? "")}</td>
          </tr>
        `);

        target.innerHTML = `
          <table>
            <thead>
              <tr><th>Event</th><th>Match</th><th>Alliance</th><th>Result</th><th>EPA</th></tr>
            </thead>
            <tbody>${rows.join("")}</tbody>
          </table>
        `;
      }

      async function loadData() {
        const teamSummaryEl = document.getElementById("team-summary");
        const teamYearEl = document.getElementById("team-year");
        const matchesEl = document.getElementById("matches");
        const errorsEl = document.getElementById("errors");

        try {
          const response = await fetch("./scouting-data.json", { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status} while loading scouting-data.json`);
          }

          const payload = await response.json();
          const data = payload.data || {};
          const errors = payload.errors || {};

          renderKeyValues(teamSummaryEl, data.team || {}, ["team", "name", "state", "country", "rookie_year"]);
          renderKeyValues(teamYearEl, data.team_year || {}, ["year", "record", "epa_end", "norm_epa", "wins", "losses", "ties"]);
          renderMatches(matchesEl, data.team_matches || []);

          errorsEl.textContent = Object.keys(errors).length ? JSON.stringify(errors, null, 2) : "None";
        } catch (error) {
          const message = error instanceof Error ? error.message : String(error);
          teamSummaryEl.innerHTML = '<span class="error">Failed to load scouting-data.json.</span>';
          teamYearEl.innerHTML = '<span class="error">Failed to load scouting-data.json.</span>';
          matchesEl.innerHTML = '<span class="error">Failed to load scouting-data.json.</span>';
          errorsEl.textContent = message;
        }
      }

      loadData();
    </script>
  </body>
</html>
